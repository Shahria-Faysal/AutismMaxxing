                                                    <div className="w-11 h-6 bg-surface-container-highest peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary-fixed rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>

                                                </div>

                            <div className="pt-stack-lg flex justify-center">

                                >

                                </button>
                            </div>
                        </div>
                    </main>
                    <Footer />
                </div>

        };

        const ResultsScreen = () => {

            return (

                            <div className="w-full bg-error-container border border-error/20 rounded-lg p-stack-md flex items-start gap-stack-sm text-left">

                            <div className="flex flex-col sm:flex-row gap-stack-md w-full justify-center mt-stack-sm">

                                    Download Report

                                <button className="border border-primary text-primary bg-transparent font-label-md text-label-md px-6 py-3 rounded-lg hover:bg-surface-container-high transition-colors duration-200 flex items-center justify-center gap-2">

                                    Find Local Resources

                        </div>
                    </main>
                    <Footer />

        const App = () => {
            return (
